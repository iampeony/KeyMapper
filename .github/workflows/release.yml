name: Release - build and upload signed APK

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  build-release-apk:
    name: Build & Release Signed APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Cache Gradle dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            !~/.gradle/caches/build-cache-*
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/build.gradle.kts') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Update version number
        uses: christian-draeger/write-properties@1.0.1
        with:
          path: app/version.properties
          property: VERSION_NUM
          value: ${{ github.run_number }}

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          distribution: 'oracle'
          java-version: 21
          cache: 'gradle'

      - name: Setup Android SDK (含Build Tools/NDK)
        uses: android-actions/setup-android@v2
        with:
          ndk-version: "27.2.12479018"
          cmdline-tools-version: "11076708"
          build-tools-version: "34.0.0"

      - name: Add Android tools to PATH
        run: |
          echo "$ANDROID_HOME/build-tools/34.0.0" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install Android Rust targets
        run: |
          rustup target add armv7-linux-androideabi
          rustup target add aarch64-linux-android
          rustup target add i686-linux-android
          rustup target add x86_64-linux-android

      - name: Deploy release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE }}
          KEYSTORE_PATH: ${{ github.workspace }}/app/keystore.jks
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Error: KEYSTORE secret is empty!"
            exit 1
          fi
          
          echo "$KEYSTORE_BASE64" | base64 --decode > $KEYSTORE_PATH
          
          if [ ! -f "$KEYSTORE_PATH" ]; then
            echo "Error: Keystore file not created!"
            exit 1
          fi
          ls -l $KEYSTORE_PATH
          chmod 600 $KEYSTORE_PATH

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Debug signing config (仅调试，不验证)
        run: |
          echo "=== Signing Config Debug ==="
          echo "KEYSTORE_PATH: $KEYSTORE_PATH"
          echo "KEYSTORE_PASSWORD: ${KEYSTORE_PASSWORD:0:4}****"
          echo "KEY_ALIAS: $KEY_ALIAS"
          echo "KEY_PASSWORD: ${KEY_PASSWORD:0:4}****"
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/app/keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Build & sign Release APK
        run: ./gradlew assembleRelease --info --stacktrace
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          ORG_GRADLE_PROJECT_signingStoreFile: ${{ github.workspace }}/app/keystore.jks
          ORG_GRADLE_PROJECT_signingStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_signingKeyAlias: ${{ secrets.KEY_ALIAS }}
          ORG_GRADLE_PROJECT_signingKeyPassword: ${{ secrets.KEY_PASSWORD }}

      - name: Find Release APK
        id: find_apk
        run: |
          APK_PATH=$(find app/build/outputs/apk/release -name "keymapper-*.apk" -type f | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "Error: No APK file found!"
            ls -lR app/build/outputs/apk/
            exit 1
          fi
          APK_NAME=$(basename "$APK_PATH")
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
          echo "apk_name=$APK_NAME" >> $GITHUB_OUTPUT
          echo "APK_PATH=$APK_PATH" >> $GITHUB_ENV
          echo "APK_NAME=$APK_NAME" >> $GITHUB_ENV
          echo "Found APK: $APK_NAME at $APK_PATH"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: signed-release-apk
          path: ${{ steps.find_apk.outputs.apk_path }}
          retention-days: 30

      # 修复：提前处理所有需要格式化的变量（Commit哈希截取、时间格式化、提交信息）
      - name: Prepare release metadata
        id: release_meta
        run: |
          # 截取Commit哈希前7位
          SHORT_SHA=${{ github.sha }}
          SHORT_SHA=${SHORT_SHA:0:7}
          # 格式化构建时间（UTC+8）
          FORMATTED_TIME=$(date -d "${{ github.run_started_at }}" +"%Y-%m-%d %H:%M:%S" -u | awk '{print $1 " " $2 " (UTC)"}')
          # 获取提交信息
          COMMIT_MSG=$(git log -1 --pretty=format:"%s" ${{ github.sha }})
          # 获取分支名
          BRANCH_NAME=${{ github.ref_name }}
          
          # 输出变量
          echo "short_sha=$SHORT_SHA" >> $GITHUB_OUTPUT
          echo "formatted_time=$FORMATTED_TIME" >> $GITHUB_OUTPUT
          echo "commit_msg=$COMMIT_MSG" >> $GITHUB_OUTPUT
          echo "branch_name=$BRANCH_NAME" >> $GITHUB_OUTPUT

      # 修复：使用提前处理的变量，避免表达式嵌套错误
      - name: Create GitHub Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ github.run_number }}
          release_name: Release v${{ github.run_number }} (${{ steps.release_meta.outputs.short_sha }})
          body: |
            ## 🚀 Automated Release Build
            - **Build Number**: ${{ github.run_number }}
            - **Commit Hash**: ${{ github.sha }} (${{ steps.release_meta.outputs.short_sha }})
            - **Commit Message**: ${{ steps.release_meta.outputs.commit_msg }}
            - **Build Time**: ${{ steps.release_meta.outputs.formatted_time }}
            - **Branch**: ${{ steps.release_meta.outputs.branch_name }}
            - **APK Name**: ${{ steps.find_apk.outputs.apk_name }}
          draft: false
          prerelease: false

      - name: Upload APK to Release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ${{ steps.find_apk.outputs.apk_path }}
          asset_name: ${{ steps.find_apk.outputs.apk_name }}
          asset_content_type: application/vnd.android.package-archive
